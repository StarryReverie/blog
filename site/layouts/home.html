{{- define "hero" -}}
  <!-- The total height of this div and the navbar is approximately 100dvh. -->
  <div
    class="mx-auto h-[calc(100dvh-var(--fluid-type-emphasis)*var(--line-height-emphasis)-2*var(--space-component))] px-page"
  >
    <!-- Make this title component centered relative to the whole viewport. -->
    <header
      class="absolute inset-x-0 top-1/2 flex -translate-y-1/2 flex-col items-center justify-center gap-stack md:flex-row md:gap-inset"
    >
      <img
        src="{{ (resources.Get "images/avatar.jpg").RelPermalink }}"
        alt="avatar"
        class="max-w-40 rounded-full object-cover outline-4 outline-subtle"
      />

      <div class="flex flex-col items-center gap-line md:items-start">
        <!-- HACK: `md:mt-1` and `md:-ml-0.5` moves the title a bit to make it more visually aligned. -->
        <h1 class="text-center text-fl-h1 font-bold text-primary md:mt-1 md:-ml-0.5 md:text-left">
          {{ $.Site.Params.home.title }}
        </h1>

        <p class="text-center text-fl-emphasis font-bold text-heading md:text-left">
          {{ $.Site.Params.home.subtitle }}
        </p>
      </div>
    </header>
  </div>
{{- end -}}

{{- define "main" -}}
  <div class="mx-auto max-w-3xl space-y-gutter px-page">
    {{- if gt (strings.CountRunes .Content) 0 -}}
      <section class="-mx-inset prose max-w-none rounded-sm bg-card p-inset">
        {{ $.Content }}
      </section>
    {{- end -}}
  </div>
{{- end -}}

<div class="flex items-stretch gap-inline rounded-sm bg-card p-component">
  <img
    src="{{ $.avatarUrl }}"
    title="avatar for {{ $.title }}"
    class="size-18 shrink-0 rounded-sm object-cover transition-transform duration-200 hover:-rotate-5 md:size-20"
    loading="lazy"
  />

  <div class="flex flex-col justify-center gap-1 border-l-1 border-l-subtle/50 pl-inline">
    <h2>
      <a
        href="{{ $.url }}"
        rel="external noopener noreferrer"
        target="_blank"
        class="text-fl-emphasis font-bold text-heading transition-colors duration-200 hover:text-primary"
      >
        {{ $.title }}
      </a>
    </h2>

    <p class="line-clamp-2 text-fl-note text-subtle">
      {{ $.description }}
    </p>
  </div>
</div>

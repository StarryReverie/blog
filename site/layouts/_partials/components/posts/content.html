<div>
  <div>{{ $.Summary }}</div>

  <details class="group rounded-sm bg-background marker:text-subtle">
    <summary class="flex gap-1 p-component text-fl-body leading-none text-foreground">
      <div class="scale-y-100 transition-transform duration-200 group-open:-scale-y-100">
        {{- partialCached "components/content/icon.html" (dict "name" "chevrons-down") "chevrons-down" -}}
      </div>
      <div>Table of Contents</div>
    </summary>

    <div class="mx-control prose-toc border-t-1 border-subtle/50 py-control select-none">
      {{ $.TableOfContents }}
    </div>
  </details>

  <div>{{ $.ContentWithoutSummary }}</div>
</div>

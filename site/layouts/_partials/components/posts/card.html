<div class="space-y-stack">
  <header class="space-y-line">
    <h2>
      <a
        href="{{ $.RelPermalink }}"
        class="text-fl-emphasis font-bold text-heading transition-colors duration-400 hover:text-primary"
        >{{ $.LinkTitle | default $.Title }}</a
      >
    </h2>

    <p class="text-fl-note text-subtle">
      {{- partial "components/content/date.html" $.Date -}}
    </p>
  </header>

  <p class="text-foreground">
    {{ $.Content | transform.Plainify | strings.Truncate 120 }}
  </p>

  <div class="flex justify-end">
    <a
      href="{{ $.RelPermalink }}"
      class="text-fl-note text-subtle transition-colors duration-400 hover:text-foreground"
    >
      Read More ...
    </a>
  </div>
</div>

<div class="flex flex-wrap">
  <div class="me-auto">
    {{- if $.HasPrev -}}
      {{- partial "components/buttons/normal.html" (dict
        "title" "Go Prev"
        "link" $.Prev.URL
        "type" "neutral")
      -}}
    {{- end -}}
  </div>

  <div class="ms-auto">
    {{- if $.HasNext -}}
      <!-- prettier-ignore-start -->
      {{- partial "components/buttons/normal.html" (dict
        "title" "Go Next"
        "link" $.Next.URL
        "type" "neutral")
      -}}
      <!-- prettier-ignore-end -->
    {{- end -}}
  </div>
</div>

<div class="flex justify-center gap-stack">
  {{- if $.HasPrev -}}
    {{- partial "components/buttons/normal.html" (dict
      "title" "Go Prev"
      "link" $.Prev.URL
      "type" "neutral")
    -}}
  {{- end -}}

  {{- if $.HasNext -}}
    <!-- prettier-ignore-start -->
    {{- partial "components/buttons/normal.html" (dict
      "title" "Go Next"
      "link" $.Next.URL
      "type" "primary")
    -}}
    <!-- prettier-ignore-end -->
  {{- end -}}
</div>

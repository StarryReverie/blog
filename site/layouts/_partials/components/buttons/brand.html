<a
  href="{{ $.link }}"
  {{ range $attr, $value := $.extraAttrs }}
    {{ printf "%s=%q" $attr $value | safe.HTMLAttr }}
  {{ end }}
  class="{{ if eq $.type "primary" }}
    bg-primary text-primary-foreground hover:bg-primary-active
  {{ else if eq $.type "auxiliary" }}
    bg-primary-dim text-primary hover:bg-primary-dim-active
  {{ else }}
    {{- errorf "Unknown brand button type %q" ($.type | default "") -}}
  {{ end }} rounded-full px-[calc(2*var(--space-control))] py-control text-fl-body font-bold transition-colors duration-400"
>
  {{ $.title }}
</a>

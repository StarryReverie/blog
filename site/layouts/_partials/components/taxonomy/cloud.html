<ul class="flex flex-wrap gap-2">
  {{- range $term := $.terms.Alphabetical -}}
    <li class="flex">
      <a
        href="{{ $term.Page.RelPermalink }}"
        class="flex gap-1 rounded-full bg-muted px-[calc(1.5*var(--space-control))] py-control text-fl-body leading-none text-foreground transition-colors duration-400 hover:bg-background"
      >
        <span>{{- partialCached "components/content/icon.html" (dict "name" $.icon) $.icon -}}</span>
        <span>{{ $term.Page.LinkTitle }} <sup class="font-bold text-subtle">{{ $term.Count }}</sup></span>
      </a>
    </li>
  {{- end -}}
</ul>

<form id="search-form" class="flex" role="search">
  <input
    type="search"
    id="search-input"
    name="q"
    class="min-w-0 grow rounded-l-lg bg-card px-[calc(2*var(--space-control))] py-control text-fl-body outline-1 outline-input transition-colors duration-400 focus:outline-focus"
    placeholder="Type your query"
    aria-label="Search through site content"
  />

  <button
    id="search-button"
    class="rounded-r-lg bg-primary px-[calc(2*var(--space-control))] py-control text-fl-body font-bold text-primary-foreground outline-1 outline-primary transition-colors duration-400 hover:bg-primary-active hover:outline-primary-active focus:outline-focus"
  >
    Search
  </button>
</form>

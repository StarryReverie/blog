<div class="space-y-stack">
  <p class="flex gap-1 text-fl-body text-subtle">
    <span>{{- partial "components/content/icon.html" (dict "name" "calendar-up") -}}</span>
    <span>{{- partial "components/content/date-time.html" $.Date -}}</span>
  </p>

  <div class="prose max-w-none">
    {{ $.Content }}
  </div>

  <div class="flex justify-end">
    <a
      href="{{ $.RelPermalink }}"
      class="text-fl-note text-subtle transition-colors duration-400 hover:text-foreground"
    >
      View in Separate Page ...
    </a>
  </div>
</div>

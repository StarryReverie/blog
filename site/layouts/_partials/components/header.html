<header x-data="{ open: false }" class="w-full bg-card">
  <div class="mx-auto max-w-4xl px-page py-component">
    <div class="peer flex items-center justify-between">
      <a
        href="{{ site.Home.RelPermalink }}"
        class="text-fl-emphasis font-bold text-primary transition-colors duration-400 hover:text-primary-active"
        >{{ site.Title }}</a
      >

      <div class="flex items-center">
        <nav aria-label="Main Menu" class="hidden md:block">
          {{- partial "components/navbar/desktop-menu.html" (dict "page" $ "menu" site.Menus.main) -}}
        </nav>

        <button
          type="button"
          class="rounded-sm p-control text-fl-emphasis leading-none text-foreground transition-colors duration-400 hover:bg-background"
          x-data="themeToggle"
          @click="toggle()"
          aria-label="Switch between light and dark theme"
          title="Switch between light and dark theme"
        >
          <span class="inline dark:hidden">
            {{- partialCached "components/content/icon.html" (dict "name" "sun") "sun" -}}
          </span>
          <span class="hidden dark:inline">
            {{- partialCached "components/content/icon.html" (dict "name" "moon") "moon" -}}
          </span>
        </button>

        <div class="md:hidden">
          <input type="checkbox" id="mobile-menu" name="mobile-menu" class="hidden" />

          <label
            for="mobile-menu"
            class="block rounded-sm p-control text-fl-emphasis leading-none text-foreground transition-colors duration-400 hover:bg-background"
          >
            {{- partialCached "components/content/icon.html" (dict "name" "menu-2") "menu-2" -}}
          </label>
        </div>
      </div>
    </div>

    <nav class="max-h-0 overflow-hidden peer-has-checked:max-h-full peer-has-checked:md:max-h-0" aria-label="Main Menu">
      {{- partial "components/navbar/mobile-menu.html" (dict "page" $ "menu" site.Menus.main) -}}
    </nav>
  </div>
</header>

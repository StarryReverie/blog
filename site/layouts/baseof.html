<!doctype html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction "ltr" }}" class="bg-card">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      {{- if page.IsHome -}}
        {{ site.Title }}
      {{- else -}}
        {{ printf "%s | %s" site.Title page.Title }}
      {{- end -}}
    </title>

    {{- partialCached "resources/fonts.html" "emptyContext" -}}
    {{- partial "resources/css.html" "emptyContext" -}}
    {{- partialCached "resources/js.html" "emptyContext" -}}
  </head>

  <body class="space-y-section bg-background pb-page">
    {{- partial "components/header.html" $ -}}
    <main>{{- block "main" $ -}}{{- end -}}</main>
    {{- partialCached "components/footer.html" $ -}}
  </body>
</html>

{{- $url := urls.Parse $.Destination -}}
<a
  href="{{ $.Destination | safe.URL }}"
  {{ with $title := $.Title }}title="{{ $title }}"{{ end }}
  {{ if $url.IsAbs }}rel="external noopener noreferrer" target="_blank"{{ end }}
  class="link"
  >{{ or $.Text "" }}</a
>
{{- /* chomp trailing newline */ -}}

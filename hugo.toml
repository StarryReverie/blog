baseURL = "https://blog.starryreverie.cc/"
title = "StarryReverie 星缀夜空"
copyright = "Copyright (C) 2025 [Justin Chen](https://github.com/starryreverie/) · Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
locale = "zh-cn"
theme = "PaperMod"

enableRobotsTXT = true
hasCJKLanguage = true

publishDir = ".hugo-publish"
resourceDir = ".hugo-resources"

[module]
  [[module.mounts]]
    source = "site/data"
    target = "data"

  [[module.mounts]]
    source = "site/layouts"
    target = "layouts"

  [[module.mounts]]
    source = "site/i18n"
    target = "i18n"

  [[module.mounts]]
    source = "site/archetypes"
    target = "archetypes"

  [[module.mounts]]
    source = "site/assets"
    target = "assets"

  [[module.mounts]]
    source = "site/static"
    target = "static"

[taxonomies]
category = "categories"
tag = "tags"

[minify]
disableXML = true
minifyOutput = true

[outputs]
home = [ "HTML", "RSS", "JSON" ]

[[menu.main]]
name = "Archive"
url = "./archives/"
weight = 1

[[menu.main]]
name = "Categories"
url = "./categories/"
weight = 2

[[menu.main]]
name = "Tags"
url = "./tags/"
weight = 3

[[menu.main]]
name = "About"
url = "./about/"
weight = 4

[markup.goldmark.extensions.passthrough]
enable = true

  [markup.goldmark.extensions.passthrough.delimiters]
  block = [ [ "$$", "$$" ] ]
  inline = [ [ "$", "$" ] ]

[params]
env = "production"
title = "StarryReverie 星缀夜空"
description = "Justin Chen's personal blog"
author = "Justin Chen"
defaultTheme = "light"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
  Title = "Welcome to Justin Chen's personal blog"
  Content = "A world where insightful ideas spark."

  [params.profileMode]
  enabled = false

  [[params.socialIcons]]
  name = "github"
  title = "GitHub Profile"
  url = "https://github.com/starryreverie"

  [[params.socialIcons]]
  name = "telegram"
  title = "Telegram Account"
  url = "https://t.me/starryreverie0"

  [[params.socialIcons]]
  name = "email"
  title = "Email"
  url = "mailto:starryreverie@proton.me"

  [[params.socialIcons]]
  name = "RSS"
  title = "Subscribe to RSS"
  url = "./index.xml"

  [params.editPost]
  URL = "https://github.com/StarryReverie/blog/tree/master/content"
  Text = "Edit"
  appendFilePath = true

  [params.assets]
  disableHLJS = true
